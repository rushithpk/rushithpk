<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="bird">
      <path d="M0,10 Q10,0 20,10 Q10,4 0,10 Z" fill="currentColor">
        <animate attributeName="d"
          values="
            M0,10 Q10,-6 20,10 Q10,4 0,10 Z;
            M0,10 Q10,0 20,10 Q10,4 0,10 Z;
            M0,10 Q10,-6 20,10 Q10,4 0,10 Z"
          dur="0.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </defs>

  <g color="#58a6ff">
    <use href="#bird" x="-20">
      <animateMotion path="M0,120 Q250,40 500,90 T1020,60" dur="9s" repeatCount="indefinite"/>
    </use>
  </g>
  <g color="#79c0ff">
    <use href="#bird" x="-20">
      <animateMotion path="M0,80 Q250,10 500,60 T1020,30" dur="9s" begin="1.2s" repeatCount="indefinite"/>
    </use>
  </g>
  <g color="#a5d6ff">
    <use href="#bird" x="-20">
      <animateMotion path="M0,140 Q250,70 500,110 T1020,90" dur="9s" begin="2.4s" repeatCount="indefinite"/>
    </use>
  </g>
  <g color="#ff7b72">
    <use href="#bird" x="-20">
      <animateMotion path="M0,50 Q250,-10 500,40 T1020,10" dur="9s" begin="3.6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g color="#d2a8ff">
    <use href="#bird" x="-20">
      <animateMotion path="M0,100 Q250,30 500,80 T1020,50" dur="9s" begin="4.8s" repeatCount="indefinite"/>
    </use>
